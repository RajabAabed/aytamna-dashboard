<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>بطاقة المستفيد</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .card {
        width: 600px;
        background-color: #1e7f75;
        color: white;
        border-end-start-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        position: relative;
        border-start-end-radius: 10px;
        border-start-start-radius: 10px;
        border-end-end-radius: 10px;
        border-end-start-radius: 10px;
        overflow: hidden;
      }
      .card input {
        width: 100%;
        padding: 8px;
        margin: 5px 0;
        border: none;
        border-radius: 5px;
        background-color: #ffffff62;
      }
      .logo {
        text-align: left;
        margin-top: 20px;
        font-size: 12px;
        width: 40%;
      }
      .logo img {
        width: 100%;
      }
      .validity {
        text-align: center;
        font-size: 14px;
        margin-top: 10px;
      }
      .card-header {
        display: flex;
        justify-items: flex-start;
        flex-direction: row;
        justify-content: space-between;
        padding: 20px;
      }
      .lable {
        width: 40%;
      }
      .qr-code {
        width: 40%;
        text-align: end;
      }
      .card-footer {
        background-color: #fff;
        color: #1e7f75;
        padding: 10px;
        display: flex;
        border-end-end-radius: 10px;
        border-end-start-radius: 10px;
        flex-direction: row;
        justify-content: space-between;
        align-items: flex-end;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="card-header">
        <div class="lable">
          <label>اسم المستفيد:</label>
          <input type="text" placeholder="" readonly />
          <label>رقم الهوية:</label>
          <input type="text" placeholder="" readonly />
          <label>رقم المستفيد:</label>
          <input type="text" placeholder="" readonly />
          <label>تاريخ الإصدار:</label>
          <input type="text" placeholder="" readonly />
          <label>اسم الجمعية:</label>
          <input type="text" placeholder="" readonly />
        </div>
        <div class="qr-code">Code</div>
      </div>
      <div class="card-footer">
        <div class="logo">
          <img src="../assets/images/scfoa-logo.jpeg" alt="" />
        </div>
        <div class="validity">هذه البطاقة صالحة لمدة عام</div>
      </div>
    </div>
  </body>
</html>
